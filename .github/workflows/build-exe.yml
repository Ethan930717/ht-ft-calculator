name: 自动打包 Windows 客户端 (Tauri 轻量版)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows x64 轻量客户端 (Tauri + WebView2)
    runs-on: windows-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 Rust 编译环境 (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 编译加速缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装项目依赖
        run: npm install

      - name: 准备前端独立发布资源
        run: node scripts/prepare-web.js

      - name: 执行 Tauri 编译 (直接生成独立免安装单文件 EXE)
        run: npx tauri build --no-bundle

      - name: 整理构建产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri/target/release/ht-ft-calculator.exe" "dist/ht-ft-calculator.exe" -Force
          Write-Host "已输出绿色单文件客户端: dist/ht-ft-calculator.exe"
          Get-ChildItem dist/*.exe | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: 上传构建产物 (每次提交可在 Actions 页面直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: 半全场实战配资计算器-Windows单文件版
          path: dist/ht-ft-calculator.exe
          if-no-files-found: error
          retention-days: 30

      - name: 自动发布 / 同步更新到 GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '半全场实战配资计算器 v1.0.0' }}
          target_commitish: ${{ github.sha }}
          files: dist/ht-ft-calculator.exe
          body: |
            ### 半全场实战配资计算器 Windows 桌面客户端 (绿色单文件版 ~3.8MB)

            - **下载即用**: `ht-ft-calculator.exe`（单文件免安装，双击直接运行）
            - **底层引擎**: 基于 Windows 原生 **WebView2**，超低内存占用，秒级冷启动。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
