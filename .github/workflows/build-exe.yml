name: 自动打包 Windows 客户端 (Tauri 轻量版)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows x64 轻量客户端 (Tauri + WebView2)
    runs-on: windows-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 Rust 编译环境 (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 编译加速缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装项目依赖
        run: npm install

      - name: 准备前端独立发布资源
        run: node scripts/prepare-web.js

      - name: 执行 Tauri 发布编译 (生成安装包与可执行程序)
        run: npx tauri build

      - name: 整理构建产物并重命名
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. 复制 NSIS 安装包 (带引导安装与桌面/开始菜单快捷方式，约 2~4MB)
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
              $destName = "dist/半全场实战配资计算器-Windows安装包(x64).exe"
              Copy-Item $_.FullName $destName -Force
              Write-Host "已输出安装包: $destName"
          }

          # 2. 复制独立免安装便携版 EXE (双击直接运行，约 2~4MB)
          if (Test-Path "src-tauri/target/release/ht-ft-calculator.exe") {
              $destPortable = "dist/半全场实战配资计算器-Windows便携免安装版(x64).exe"
              Copy-Item "src-tauri/target/release/ht-ft-calculator.exe" $destPortable -Force
              Write-Host "已输出便携版: $destPortable"
          }

          # 打印产物清单与体积 (MB)
          Get-ChildItem dist/*.exe | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: 上传构建产物 (每次提交可在 Actions 页面直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: 半全场实战配资计算器-Windows客户端(超轻量版)
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 自动发布 / 同步更新到 GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -match 'refs/tags/(v.+)') { $matches[1] } else { "v1.0.0" }
          $title = if ($tag -eq "v1.0.0") { "半全场实战配资计算器 v1.0.0" } else { "半全场实战配资计算器 $tag" }
          $files = (Get-Item dist/*.exe).FullName

          Write-Host "准备发布到 GitHub Release: Tag=$tag, Title=$title"
          
          # 检查该 Release 是否已经存在
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release 已存在，更新并覆盖客户端附件..."
              gh release upload $tag $files --clobber
          } else {
              Write-Host "创建全新 Release 并上传客户端附件..."
              gh release create $tag $files --title $title --notes "半全场实战配资计算器 Windows 桌面客户端（基于 Tauri + WebView2 引擎，~3MB 极简超轻量版）。开箱即用，支持多维变式拆单、自动拉取实时数据与一键配资测算。"
          }
